name: agent-memory-wiki-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wiki_test
      POSTGRES_PASSWORD: wiki_owner
      POSTGRES_USER: wiki_owner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_owner -d wiki_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
