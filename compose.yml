name: agent-memory-wiki

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiki_local_only}
      POSTGRES_USER: wiki_owner
      WIKI_RUNTIME_PASSWORD: ${WIKI_RUNTIME_PASSWORD:-wiki_runtime_local_only}
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD:-wiki_admin_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_owner -d wiki"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tools
    command: ["pnpm", "migrate"]
    environment:
      DATABASE_URL: postgresql://wiki_owner:${POSTGRES_PASSWORD:-wiki_local_only}@postgres:5432/wiki
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: .
      target: runner
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CREDENTIAL_HASH_SECRET: ${CREDENTIAL_HASH_SECRET:?set CREDENTIAL_HASH_SECRET in .env}
      DATABASE_URL: postgresql://wiki_runtime:${WIKI_RUNTIME_PASSWORD:-wiki_runtime_local_only}@postgres:5432/wiki
      GLOBAL_READ_ONLY: ${GLOBAL_READ_ONLY:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
      NETWORK_ADDRESS_HEADER: ${NETWORK_ADDRESS_HEADER:-x-real-ip}
      NETWORK_DAILY_HMAC_SECRET: ${NETWORK_DAILY_HMAC_SECRET:?set NETWORK_DAILY_HMAC_SECRET in .env}
      NETWORK_DAILY_HMAC_DATE: ${NETWORK_DAILY_HMAC_DATE:?set NETWORK_DAILY_HMAC_DATE in .env}
      NETWORK_NEXT_DAILY_HMAC_SECRET: ${NETWORK_NEXT_DAILY_HMAC_SECRET:-}
      NETWORK_NEXT_DAILY_HMAC_DATE: ${NETWORK_NEXT_DAILY_HMAC_DATE:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres-data:
